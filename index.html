<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise for Israa</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fcfaf9; 
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            text-align: center;
        }

        /* حاوية الهدية */
        #gift-container {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease-out; /* سرعة استجابة الهروب */
            user-select: none;
            z-index: 10;
        }

        .gift-icon {
            font-size: 110px;
            filter: drop-shadow(0 8px 20px rgba(183, 110, 121, 0.25));
        }

        /* البطاقة الأنثوية الأنيقة */
        #celebration-card {
            display: none;
            background-color: #fff;
            padding: 45px;
            border-radius: 40px;
            box-shadow: 0 25px 60px rgba(188, 143, 143, 0.15);
            border: 1px solid #f0f0f0;
            max-width: 80%;
            animation: elegantShow 1.5s ease;
        }

        .main-title {
            color: #444;
            font-size: 2.6rem;
            margin: 5px 0;
        }

        .name-highlight {
            color: #b76e79; /* Rose Gold الأنيق */
            font-style: italic;
        }

        .sub-text {
            color: #999;
            font-size: 1.15rem;
            line-height: 1.8;
            margin-top: 15px;
        }

        @keyframes elegantShow {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* القلوب والنجوم */
        .decor-item {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            animation: riseUp 3.5s ease-out forwards;
        }

        @keyframes riseUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(450deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="gift-container" onmouseover="escapeGift()" onclick="openGift()">
        <div class="gift-icon">🎁</div>
        <p id="hint" style="color: #b76e79; font-size: 0.95rem; margin-top: 12px; font-weight: bold; letter-spacing: 1px;">Catch it, Israa! ✨</p>
    </div>

    <div id="celebration-card">
        <div style="font-size: 55px; margin-bottom: 10px;">🌸🌷✨</div>
        <h1 class="main-title">Happy Birthday,</h1>
        <h1 class="main-title"><span class="name-highlight">Israa</span>!</h1>
        <p class="sub-text">Wishing you a day filled with all the <br>beauty and elegance you bring to the world.</p>
        <div style="margin-top: 35px; font-size: 22px; color: #b76e79; opacity: 0.7;">🤍🍰✨</div>
    </div>

    <script>
        let count = 0;
        const totalSteps = 5; // عدد محاولات الهروب
        const gift = document.getElementById('gift-container');
        const hintText = document.getElementById('hint');

        function escapeGift() {
            if (count < totalSteps) {
                // حساب مساحة عشوائية مع ترك هوامش عن حواف الشاشة
                const padding = 150;
                const newX = Math.random() * (window.innerWidth - padding);
                const newY = Math.random() * (window.innerHeight - padding);
                
                gift.style.left = newX + 'px';
                gift.style.top = newY + 'px';
                
                count++;

                // تحديث النص لتشجيعها
                if (count === 3) {
                    hintText.innerText = "You're getting close! 🏃‍♀️";
                }
                if (count === totalSteps) {
                    hintText.innerText = "Okay, you won! Click me 🤍";
                    // إيقاف الهروب لكي تتمكن من الضغط
                    gift.onmouseover = null; 
                }
            }
        }

        function openGift() {
            if (count >= totalSteps) {
                gift.style.display = 'none';
                document.getElementById('celebration-card').style.display = 'block';
                
                // إطلاق زينة احتفالية (قلوب، نجوم، زهور)
                for(let i = 0; i < 65; i++) {
                    setTimeout(spawnDecor, i * 40);
                }
            }
        }

        function spawnDecor() {
            const symbols = ['🌸', '✨', '💖', '🤍', '⭐'];
            const el = document.createElement('div');
            el.className = 'decor-item';
            el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = '95vh';
            el.style.fontSize = Math.random() * 25 + 15 + 'px';
            el.style.color = '#b76e79';
            document.body.appendChild(el);
            
            setTimeout(() => el.remove(), 3500);
        }
    </script>
</body>
</html>
