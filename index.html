<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية لإسراء</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fce4ec;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .gift-container {
            text-align: center;
            cursor: pointer;
        }

        /* شكل الصندوق */
        .gift-box {
            position: relative;
            width: 150px;
            height: 150px;
            background-color: #e91e63;
            margin: 0 auto;
            border-radius: 10px;
            transition: transform 0.5s;
        }

        .gift-box::before {
            content: "";
            position: absolute;
            width: 20px;
            height: 100%;
            background-color: #ad1457;
            left: 50%;
            transform: translateX(-50%);
        }

        .gift-box::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 20px;
            background-color: #ad1457;
            top: 50%;
            transform: translateY(-50%);
        }

        /* الغطاء */
        .lid {
            position: absolute;
            width: 170px;
            height: 40px;
            background-color: #ff4081;
            top: -20px;
            left: -10px;
            border-radius: 5px;
            z-index: 2;
            transition: transform 0.7s;
        }

        /* الرسالة المخفية */
        .message {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            opacity: 0;
            transition: all 0.8s ease;
            z-index: 1;
            color: #d81b60;
            font-weight: bold;
        }

        /* الأنيميشن لما نضغط */
        .active .lid {
            transform: translateY(-100px) rotate(-10deg);
        }

        .active .message {
            opacity: 1;
            transform: translateX(-50%) translateY(-150px);
        }

        .tap-text {
            margin-top: 20px;
            color: #ad1457;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="gift-container" id="giftWrapper">
    <div class="message" id="msg">
        أحلى هدية لأغلى إسراء! 🌸✨
    </div>
    <div class="gift-box">
        <div class="lid"></div>
    </div>
    <p class="tap-text">انقر على الصندوق لفتحه</p>
</div>

<script>
    const wrapper = document.getElementById('giftWrapper');
    
    // وظيفة الفتح تخدم للنقر واللمس
    function openGift() {
        wrapper.classList.toggle('active');
    }

    // دعم التلفون (Touch) والكمبيوتر (Click)
    wrapper.addEventListener('click', openGift);
    wrapper.addEventListener('touchstart', function(e) {
        e.preventDefault(); // يمنع أي مشاكل مع المتصفح
        openGift();
    });
</script>

</body>
</html>
