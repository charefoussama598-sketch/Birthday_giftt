<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية لإسراء</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffebee;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* حاوية الهدية */
        .gift-container {
            position: relative;
            cursor: pointer;
        }

        /* زر مخفي للتحكم في الفتح بدون جافاسكريبت */
        #open-gift {
            display: none;
        }

        /* شكل الصندوق */
        .gift-box {
            width: 140px;
            height: 140px;
            background-color: #f44336;
            position: relative;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 10;
        }

        /* الأشرطة */
        .gift-box::before {
            content: "";
            position: absolute;
            width: 25px;
            height: 100%;
            background-color: #d32f2f;
            left: 50%;
            transform: translateX(-50%);
        }

        /* الغطاء */
        .lid {
            position: absolute;
            width: 160px;
            height: 40px;
            background-color: #ff5252;
            top: -20px;
            left: -10px;
            border-radius: 5px;
            z-index: 11;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        /* الرسالة */
        .message {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            color: #c2185b;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            opacity: 0;
            transition: all 0.6s ease;
            z-index: 1;
        }

        /* الحركة عند النقر (باستعمال Checkbox) */
        #open-gift:checked ~ .gift-container .lid {
            transform: translateY(-120px) rotate(15deg);
        }

        #open-gift:checked ~ .gift-container .message {
            opacity: 1;
            transform: translateX(-50%) translateY(-140px);
        }

        .hint {
            margin-top: 25px;
            color: #d32f2f;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <input type="checkbox" id="open-gift">
    
    <label for="open-gift" class="gift-container">
        <div class="message">
            أحلى مفاجأة لإسراء! 🌸✨<br>
            كل عام وأنتِ بخير
        </div>
        <div class="gift-box">
            <div class="lid"></div>
        </div>
        <div class="hint">اضغط على الصندوق لفتحه</div>
    </label>

</body>
</html>
