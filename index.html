<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Something for Israa</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5; /* White Smoke: خلفية ناعمة ونظيفة */
            font-family: 'Playfair Display', serif; /* خط أنيق جداً */
            overflow: hidden;
            text-align: center;
        }

        /* تصميم صندوق الهدية */
        #gift-box {
            position: relative;
            cursor: pointer;
            transition: transform 0.5s ease;
            animation: pulse 1.5s infinite; /* تأثير نبض لطيف وجذاب */
        }

        #gift-box:hover {
            transform: scale(1.05) rotate(2deg); /* حركة بسيطة عند التمرير */
        }

        /* تصميم البطاقة الأنيقة بالداخل */
        #celebration-card {
            display: none;
            background-color: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(188, 143, 143, 0.2); /* Dusty Pink shadow */
            border: 2px solid #b76e79; /* Rose Gold border */
            max-width: 80%;
            animation: cardFadeIn 1s ease-out; /* دخول ناعم للبطاقة */
        }

        .main-title {
            color: #2c3e50; /* لون كلاسيكي */
            font-size: 2.8rem;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .name-highlight {
            color: #b76e79; /* لون Rose Gold للاسم */
            font-style: italic;
        }

        .sub-text {
            color: #7f8c8d;
            font-size: 1.3rem;
            line-height: 1.6;
            margin-top: 15px;
        }

        /* تأثير النبض (Pulse) */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(183, 110, 121, 0.3); }
            70% { transform: scale(1.03); box-shadow: 0 0 10px 15px rgba(183, 110, 121, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(183, 110, 121, 0); }
        }

        /* دخول ناعم للبطاقة (Card Fade-in) */
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تصميم القلوب والنجوم المتساقطة */
        .decoration {
            position: absolute;
            pointer-events: none;
            user-select: none;
            opacity: 0;
            animation: fall 3s ease-out forwards;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="gift-box" onclick="openCelebration()">
        <div style="font-size: 120px; color: #b76e79;">🎁</div> <p style="color: #b76e79; font-weight: bold; font-style: italic;">Just for you, <span class="name-highlight">Israa</span></p>
    </div>

    <div id="celebration-card">
        <div style="font-size: 60px;">🎂🤍</div> <h1 class="main-title">Happy Birthday!</h1>
        <h1 class="main-title"><span class="name-highlight">Israa</span> 🎉</h1>
        <p class="sub-text">Wishing you a year filled with elegance, happiness,<br>and all the success you deserve.</p>
        <p style="color: #b76e79; font-size: 1.1rem; margin-top: 30px;">- Crafted with ❤️ for you</p>
    </div>

    <script>
        function openCelebration() {
            // إخفاء صندوق الهدية وإظهار البطاقة
            document.getElementById('gift-box').style.display = 'none';
            document.getElementById('celebration-card').style.display = 'block';
            
            // إنشاء القلوب والنجوم المتساقطة (تأثير أنثوي)
            for(let i = 0; i < 60; i++) {
                setTimeout(createDecoration, i * 50); // تساقط تدريجي
            }
        }

        function createDecoration() {
            const decorations = ['✨', '❤️', '🌸', '💖']; // نجوم، قلوب، زهور صغيرة
            const decor = document.createElement('div');
            decor.className = 'decoration';
            decor.innerText = decorations[Math.floor(Math.random() * decorations.length)];
            
            // تخصيص عشوائي للمظهر
            decor.style.left = Math.random() * 100 + 'vw';
            decor.style.top = '-20px';
            decor.style.fontSize = Math.random() * 25 + 15 + 'px'; // أحجام مختلفة
            decor.style.color = Math.random() > 0.5 ? '#b76e79' : '#fff'; // أبيض أو ذهبي وردي

            document.body.appendChild(decor);

            // حذف العنصر بعد انتهاء الحركة
            setTimeout(() => {
                decor.remove();
            }, 3000);
        }
    </script>
</body>
</html>
