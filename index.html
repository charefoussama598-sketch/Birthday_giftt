<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Gift for Israa</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #fff0f3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .gift-wrapper {
            position: relative;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .gift-box {
            width: 120px;
            height: 120px;
            background: #ff4d6d;
            position: relative;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* Ribbon */
        .gift-box::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 100%;
            background: #c9184a;
            left: 50%;
            transform: translateX(-50%);
        }

        .lid {
            width: 130px;
            height: 30px;
            background: #ff758f;
            position: absolute;
            top: -15px;
            left: -5px;
            z-index: 11;
            border-radius: 5px;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        /* Message Card */
        .card {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translate(-50%, 0);
            width: 220px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.8s ease;
            color: #ff4d6d;
            z-index: 1;
        }

        .card h2 { margin: 0; font-size: 22px; }
        .card p { font-size: 16px; margin: 10px 0 0; }

        /* Open State Animations */
        .open .lid {
            transform: translateY(-120px) rotate(-20deg);
            opacity: 0;
        }

        .open .card {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -180px);
        }

        .open .gift-box { transform: scale(0.9); background: #ffb3c1; }

        .instruction {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #ff4d6d;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="gift-wrapper" id="giftBox">
    <div class="card">
        <h2>Happy Birthday, Israa! 🌸</h2>
        <p>Wishing you a day filled with love and laughter. You deserve the best! ✨</p>
    </div>
    <div class="lid"></div>
    <div class="gift-box"></div>
    <div class="instruction">Tap to open
